<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" role="img" aria-labelledby="title">
  <title id="title">Elma Market Belen Sarımazı store illustration</title>

  <style>
    .rays, .wing, .tree, .flag, .leg, .spin, .building { transform-box: fill-box; }

    .rays { transform-origin: center; animation: spin 18s linear infinite; }
    .cloud { animation: drift 46s linear infinite; }
    .cloud--slow { animation-duration: 62s; animation-delay: -30s; }
    .cloud--mid { animation-duration: 54s; animation-delay: -12s; }
    .bird { animation: fly 18s linear infinite; }
    .wing { transform-origin: center; animation: flap .45s ease-in-out infinite alternate; }
    .tree { transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }
    .garland { animation: bob 2.4s ease-in-out infinite alternate; }
    .garland--offset { animation-delay: -1.2s; }
    .balloon { opacity: 0; animation: rise 10s ease-in infinite; }
    .flag { transform-origin: 0 50%; animation: wave 1.6s ease-in-out infinite alternate; }
    .building { transform-origin: 50% 100%; animation: breathe 3s ease-in-out infinite; }
    .walker { animation: walk 18s linear infinite; }
    .walker__body { animation: bob .35s ease-in-out infinite alternate; }
    .leg { transform-origin: 50% 0; animation: step .35s ease-in-out infinite alternate; }
    .leg--back { animation-direction: alternate-reverse; }
    .driving { animation: drive 7s linear infinite; }
    .spin { transform-origin: center; animation: spin .5s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(900px); } }
    @keyframes fly {
      0% { transform: translate(-80px, 10px); }
      50% { transform: translate(400px, -12px); }
      100% { transform: translate(880px, 6px); }
    }
    @keyframes flap { to { transform: scaleY(.35); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(4px); } }
    @keyframes rise {
      0% { transform: translate(0, 40px); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate(14px, -110px); }
      85% { opacity: 1; }
      100% { transform: translate(-8px, -240px); opacity: 0; }
    }
    @keyframes wave { from { transform: skewY(0deg) scaleX(1); } to { transform: skewY(-7deg) scaleX(.88); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, .992); } }
    @keyframes walk { from { transform: translateX(80px); } to { transform: translateX(720px); } }
    @keyframes step { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    @keyframes drive { from { transform: translateX(-90px); } to { transform: translateX(900px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .balloon { opacity: 1; }
    }
  </style>

